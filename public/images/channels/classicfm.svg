<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="classicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1a38"/>
      <stop offset="100%" stop-color="#030814"/>
    </linearGradient>
    <linearGradient id="classicGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="36" fill="url(#classicBg)" stroke="#3b82f6" stroke-width="3"/>
  
  <g transform="translate(100, 50)">
    <circle cx="0" cy="0" r="22" fill="#030814" stroke="#eab308" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="16" fill="none" stroke="#1e3a8a" stroke-width="1"/>
    <circle cx="0" cy="0" r="10" fill="none" stroke="#1e3a8a" stroke-width="1"/>
    <circle cx="0" cy="0" r="6" fill="#eab308"/>
    <circle cx="0" cy="0" r="2" fill="#030814"/>
  </g>

  <text x="100" y="104" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-weight="900" font-size="24" letter-spacing="1">
    CLASSIC FM
  </text>

  <g transform="translate(100, 138)">
    <rect x="-46" y="-13" width="92" height="26" rx="13" fill="url(#classicGold)"/>
    <text x="0" y="5" text-anchor="middle" fill="#0f172a" font-family="system-ui, sans-serif" font-weight="900" font-size="14" letter-spacing="0.5">
      97.3 FM
    </text>
  </g>

  <text x="100" y="176" text-anchor="middle" fill="#93c5fd" font-family="system-ui, sans-serif" font-weight="700" font-size="8.5" letter-spacing="1.2">
    THE SONGS YOU KNOW &amp; LOVE
  </text>
</svg>
