<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="50%" stop-color="#141414" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#FF3B30" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#A3A3A3" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E50914" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#E50914" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#262626" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)" />
  <rect width="1280" height="720" fill="url(#grid)" />
  <circle cx="640" cy="360" r="420" fill="url(#glow)" />

  <!-- Frame border -->
  <rect x="24" y="24" width="1232" height="672" rx="16" fill="none" stroke="#262626" stroke-width="1.5" />

  <!-- Badge at top -->
  <g transform="translate(640, 240)">
    <rect x="-90" y="-18" width="180" height="36" rx="18" fill="#1f1f1f" stroke="#E50914" stroke-width="1" />
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" letter-spacing="3" fill="#E50914" text-anchor="middle">ADC CREATORS</text>
  </g>

  <!-- Main "COMING SOON" text -->
  <text x="640" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-size="64" font-weight="900" letter-spacing="10" fill="url(#textGrad)" text-anchor="middle">
    COMING SOON
  </text>

  <!-- Subtitle -->
  <text x="640" y="430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" letter-spacing="4" fill="#737373" text-anchor="middle">
    EXCLUSIVE CREATOR ORIGINALS &amp; SPOTLIGHTS
  </text>

  <!-- Subtle bottom red line -->
  <rect x="540" y="470" width="200" height="2" fill="url(#accentGrad)" rx="1" />
</svg>
